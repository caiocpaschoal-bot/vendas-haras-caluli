[functions]
  included_files = ["index.html"]

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

[[redirects]]
  from = "/lote/*"
  to = "/.netlify/functions/lote/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/historia"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "https://harascaluli.com.br/*"
  to = "https://www.harascaluli.com.br/:splat"
  status = 301
  force = true
